<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Masks - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Rooms.css">
</head>
<body>

    <div class="bg-blur"></div>

    <div class="dashboard-wrapper">
        <div class="organic-grid">
            
            <aside class="col-right-sidebar">
                <div class="avatar-circle glass-panel">
                    <span id="playerAvatarInitial"></span>
                </div>
                
                <div class="nav-capsule glass-panel">
                    <div class="nav-icon active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
                    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="10 17 15 12 10 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="15" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                </div>
            </aside>

            <main class="col-center-main">
                <div class="entity-showcase">
                    
                    <button class="snow-glow-btn">دخول للظلال</button>

                    <div class="protrusion-wrapper organic-glass">
                        <button class="icon-btn protruding-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M5 12l7-7M5 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    </div>

                    <div class="arsenal-box organic-glass">
                        <div class="mask-btn glass-btn" data-mask="fox">
                            <svg viewBox="0 0 64 64" class="mask-svg"><path d="M32 58L12 40V20l10-14 10 10 10-10 10 14v20L32 58z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M22 30c0-4 4-6 6-4s2 6-6 4zM42 30c0-4-4-6-6-4s-2 6 6 4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M32 44v8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M12 20c8 5 12 5 20 5s12 0 20-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        </div>
                        <div class="mask-btn glass-btn active-mask" data-mask="lion">
                            <svg viewBox="0 0 64 64" class="mask-svg"><path d="M32 60c-15 0-24-10-24-25V15l10-5 14-6 14 6 10 5v20C56 50 47 60 32 60z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="30" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="30" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M32 40l-5 8h10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 25c0 0-6 5-4 15s8 10 8 10M56 25c0 0 6 5 4 15s-8 10-8 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                        </div>
                        <div class="mask-btn glass-btn" data-mask="wolf">
                            <svg viewBox="0 0 64 64" class="mask-svg"><path d="M32 60l-12-16-10-4V20l6-12 16 12 16-12 6 12v20l-10 4L32 60z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 28l6 4-2-6zM46 28l-6 4 2-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M32 42v10l-4-4h8l-4 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M32 20v15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                    </div>

                </div>
            </main>

            <aside class="col-left-stacked">
                
                <div class="bento-card glass-panel gates-card">
                    <div class="card-header">
                        <h3>بوابات العبور</h3>
                    </div>
                    <div class="levels-container">
                        <div class="level-item active-level">
                            <div class="level-info">
                                <h4>المستوى الأول</h4>
                                <span class="status-badge">متاح</span>
                            </div>
                        </div>
                        <div class="level-item locked-level">
                            <div class="level-info">
                                <h4>المستوى الثاني</h4>
                                <span class="status-badge locked">مغلق</span>
                            </div>
                            <svg class="lock-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                    </div>
                </div>

                <div class="bento-card glass-panel history-card">
                    <div class="card-header">
                        <h3>سجل المواجهات</h3>
                    </div>
                    <div class="history-list" id="matchHistoryContainer">
                        <div class="history-item">
                            <div class="history-avatar"></div>
                            <div class="history-details">
                                <h4 class="history-name" id="historyName1"></h4>
                                <p class="history-result" id="historyResult1"></p>
                            </div>
                        </div>
                        <div class="history-item">
                            <div class="history-avatar"></div>
                            <div class="history-details">
                                <h4 class="history-name" id="historyName2"></h4>
                                <p class="history-result" id="historyResult2"></p>
                            </div>
                        </div>
                    </div>
                </div>

            </aside>

        </div>
    </div>

    <script src="Rooms.js"></script>
</body>
</html>
