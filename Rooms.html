<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Masks - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Rooms.css">
</head>
<body>

    <div class="bg-blur"></div>

    <div class="dashboard-wrapper">
        <div class="organic-grid">
            
            <aside class="col-right-sidebar">
                <div class="avatar-circle glass-panel" id="playerAvatarContainer">
                    <svg viewBox="0 0 64 64" class="avatar-svg" id="currentAvatarMask">
                        <path d="M32 58L12 40V20l10-14 10 10 10-10 10 14v20L32 58z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M22 30c0-4 4-6 6-4s2 6-6 4zM42 30c0-4-4-6-6-4s-2 6 6 4z" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M32 44v8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <path d="M12 20c8 5 12 5 20 5s12 0 20-5" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                
                <div class="nav-capsule glass-panel">
                    <div class="nav-icon active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
                    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    
                    <div class="nav-icon" id="settingsNavIcon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        
                        <div class="settings-popover glass-panel" id="settingsPopover">
                            <h4 class="popover-title">إعدادات الواجهة</h4>
                            <div class="setting-row">
                                <span class="setting-label">مضيء كريستالي</span>
                                <label class="theme-switch">
                                    <input type="checkbox" id="themeToggleCheckbox">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="col-center-main">
                <div class="entity-showcase" id="entityShowcase">
                    
                    <button class="snow-glow-btn">دخول للظلال</button>

                    <div class="protrusion-arrow-box">
                        <button class="icon-btn protruding-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M5 12l7-7M5 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    </div>

                </div>

                <div class="stats-box glass-panel">
                    <div class="curve-filler-top"></div>
                    <div class="curve-filler-right"></div>
                    
                    <div class="stats-header">
                        <span class="stats-title">مستوى القناع: <strong id="maskLevelText"></strong></span>
                        <span class="stats-fragments" id="soulFragmentsText"></span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="resonanceProgressFill"></div>
                    </div>
                </div>
            </main>

            <aside class="col-left-stacked">
                <div class="bento-card glass-panel gates-card">
                    <div class="card-header">
                        <h3>بوابات العبور</h3>
                    </div>
                    <div class="levels-container">
                        <div class="level-item active-level">
                            <div class="level-info">
                                <h4>المستوى الأول</h4>
                                <span class="status-badge">متاح</span>
                            </div>
                        </div>
                        <div class="level-item locked-level">
                            <div class="level-info">
                                <h4>المستوى الثاني</h4>
                                <span class="status-badge locked">مغلق</span>
                            </div>
                            <svg class="lock-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                    </div>
                </div>

                <div class="bento-card glass-panel history-card">
                    <div class="card-header">
                        <h3>سجل المواجهات</h3>
                    </div>
                    <div class="history-list" id="matchHistoryContainer">
                        <div class="history-item">
                            <div class="history-avatar"></div>
                            <div class="history-details">
                                <h4 class="history-name" id="historyName1"></h4>
                                <p class="history-result" id="historyResult1"></p>
                            </div>
                        </div>
                        <div class="history-item">
                            <div class="history-avatar"></div>
                            <div class="history-details">
                                <h4 class="history-name" id="historyName2"></h4>
                                <p class="history-result" id="historyResult2"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <script src="Rooms.js"></script>
</body>
</html>
