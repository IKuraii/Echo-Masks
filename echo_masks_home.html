  <style>
    /* ═══════════════════════════════════════════
       DESIGN TOKENS — White Edition
    ═══════════════════════════════════════════ */
    :root {
      --accent:        #ffffff;
      --accent-bright: #ffffff;
      --accent-dim:    rgba(255,255,255,0.35);
      --accent-faint:  rgba(255,255,255,0.12);
      --white:         #f5ede0;
      --white-dim:     #9a8f7e;
      --black:         #050302;
      --glass-bg:      rgba(4, 2, 1, 0.72);
      --glass-border:  rgba(255,255,255,0.14);
      --nav-h:         72px;
      --nav-h-mobile:  64px;
      --ease-silk:     cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
    }

    body {
      font-family: 'Noto Naskh Arabic', serif;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes sceneBreath {
      0%,100% { filter: brightness(1) contrast(1); }
      12%     { filter: brightness(0.91) contrast(1.05); }
      14%     { filter: brightness(1)    contrast(1); }
      45%     { filter: brightness(0.95) contrast(1.02); }
      60%     { filter: brightness(0.87) contrast(1.07); }
      62%     { filter: brightness(1)    contrast(1); }
      88%     { filter: brightness(0.93) contrast(1.04); }
    }

    /* Dark overlay — gradient top-heavy to let title breathe */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.50) 0%,
        rgba(0,0,0,0.18) 30%,
        rgba(0,0,0,0.18) 55%,
        rgba(0,0,0,0.72) 100%
      );
    }

    /* Noise grain */
    #grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      animation: grainShift 0.12s steps(1) infinite;
    }
    @keyframes grainShift {
      0%   { background-position: 0 0; }
      25%  { background-position: 40px -20px; }
      50%  { background-position: -30px 10px; }
      75%  { background-position: 20px 35px; }
      100% { background-position: -10px -15px; }
    }

    /* Vignette */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 28%,
        rgba(0,0,0,0.42) 72%,
        rgba(0,0,0,0.76) 100%
      );
    }

    /* ═══════════════════════════════════════════
       HERO / CENTER CONTENT
    ═══════════════════════════════════════════ */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: var(--nav-h);
    }

    /* Decorative line above title */
    .deco-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 1s var(--ease-silk) 0.3s forwards;
    }
    .deco-line span {
      display: block;
      height: 1px;
      width: clamp(40px, 8vw, 100px);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    .deco-line em {
      font-style: normal;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.5rem, 1vw, 0.65rem);
      letter-spacing: 0.45em;
      color: rgba(255,255,255,0.32);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── TITLE ── */
    #title-wrap {
      position: relative;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1.1s var(--ease-silk) 0.5s forwards;
    }

    /* ECHO — hollow outline */
    #title-echo {
      display: block;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(3.8rem, 12vw, 9rem);
      line-height: 0.88;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.38);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* MASKS — solid white + glow */
    #title-masks {
      display: block;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: clamp(3.8rem, 12vw, 9rem);
      line-height: 1;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow:
        0 0 30px rgba(255,255,255,0.55),
        0 0 80px rgba(255,255,255,0.18),
        0 4px 24px rgba(0,0,0,0.95);
      position: relative;
    }

    /* Shimmer sweep — white edition */
    #title-masks::after {
      content: 'MASKS';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,255,0.15) 48%,
        rgba(255,255,255,0.32) 52%,
        transparent 70%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4.5s ease-in-out 2.5s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 160% 0; }
      100% { background-position: -60% 0; }
    }

    /* Subtitle */
    #subtitle {
      margin-top: 18px;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.55rem, 1.5vw, 0.8rem);
      letter-spacing: 0.55em;
      color: rgba(255,255,255,0.38);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s var(--ease-silk) 0.85s forwards;
    }

    /* ── CTA BUTTON ── */
    #cta-wrap {
      margin-top: 42px;
      opacity: 0;
      animation: fadeUp 1s var(--ease-silk) 1.1s forwards;
      position: relative;
    }

    #btn-start {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 48px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.55);
      color: rgba(255,255,255,0.9);
      font-family: 'Cinzel', serif;
      font-size: clamp(0.75rem, 1.8vw, 0.95rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      transition: color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      outline: none;
    }

    /* Sweep fill on hover */
    #btn-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s var(--ease-silk);
    }
    #btn-start:hover::before,
    #btn-start:focus::before { transform: translateX(100%); }

    /* Corner accents */
    #btn-start::after {
      content: '';
      position: absolute;
      top: -1px; right: -1px;
      width: 10px; height: 10px;
      border-top: 2px solid #fff;
      border-right: 2px solid #fff;
      transition: all 0.3s ease;
    }
    #btn-start .btn-corner-bl {
      position: absolute;
      bottom: -1px; left: -1px;
      width: 10px; height: 10px;
      border-bottom: 2px solid #fff;
      border-left: 2px solid #fff;
      transition: all 0.3s ease;
    }

    #btn-start:hover {
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 28px rgba(255,255,255,0.18), inset 0 0 40px rgba(255,255,255,0.04);
    }
    #btn-start:hover::after,
    #btn-start:hover .btn-corner-bl { width: 18px; height: 18px; }
    #btn-start:active { transform: scale(0.97); }

    .btn-arrow {
      width: 16px; height: 16px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    #btn-start:hover .btn-arrow { transform: translateX(-4px); }

    /* Pulsing ring */
    #cta-ring {
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
      animation: ringPulse 3s ease-in-out 2s infinite;
    }
    @keyframes ringPulse {
      0%,100% { opacity: 0.5; transform: scale(1); }
      50%     { opacity: 0;   transform: scale(1.06); }
    }

    /* Player count */
    #player-badge {
      margin-top: 24px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: rgba(154,143,126,0.5);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease 1.6s forwards;
    }
    #player-badge strong {
      color: rgba(255,255,255,0.55);
      font-weight: 600;
    }

    /* ═══════════════════════════════════════════
       SIDE DECORATIONS
    ═══════════════════════════════════════════ */
    .side-deco {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 8;
      writing-mode: vertical-rl;
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.5em;
      color: rgba(255,255,255,0.1);
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 1.5s ease 2s forwards;
    }
    .side-deco.left  { left: 14px; }
    .side-deco.right { right: 14px; transform: translateY(-50%) rotate(180deg); }

    /* ═══════════════════════════════════════════
       BOTTOM NAVIGATION BAR
    ═══════════════════════════════════════════ */
    #nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 20;
      background: var(--glass-bg);
      border-top: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(0.5);
      -webkit-backdrop-filter: blur(20px) saturate(0.5);
      display: flex;
      align-items: stretch;
      padding-bottom: env(safe-area-inset-bottom, 0);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
      opacity: 0;
      animation: slideUp 0.8s var(--ease-silk) 1.4s forwards;
    }

    /* Hairline white accent at top */
    #nav-bar::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(255,255,255,0.25) 30%,
        rgba(255,255,255,0.55) 50%,
        rgba(255,255,255,0.25) 70%,
        transparent
      );
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: rgba(255,255,255,0.38);
      font-family: 'Noto Naskh Arabic', serif;
      font-size: clamp(0.6rem, 1.5vw, 0.7rem);
      letter-spacing: 0.06em;
      transition: color 0.25s ease;
      position: relative;
      padding: 8px 0 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 0; left: 15%; right: 15%;
      height: 2px;
      background: #ffffff;
      transform: scaleX(0);
      transition: transform 0.3s var(--ease-silk), opacity 0.3s;
      opacity: 0;
      border-radius: 2px 2px 0 0;
    }

    .nav-item:hover,
    .nav-item:focus { color: #ffffff; outline: none; }

    .nav-item:hover::after,
    .nav-item.active::after { transform: scaleX(1); opacity: 1; }

    .nav-item.active { color: #ffffff; }
    .nav-item.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.65));
    }

    .nav-icon {
      width: 22px; height: 22px;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease-silk), filter 0.25s;
    }
    .nav-item:hover .nav-icon { transform: translateY(-2px); }
    .nav-item:active .nav-icon { transform: scale(0.9); }

    .nav-item .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      width: 60px; height: 60px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleAnim 0.45s ease-out forwards;
    }
    @keyframes rippleAnim {
      to { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    /* ═══════════════════════════════════════════
       ENTRANCE ANIMATIONS
    ═══════════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
    @media (max-width: 480px) {
      :root { --nav-h: var(--nav-h-mobile); }
      .deco-line { margin-bottom: 20px; }
      #subtitle  { letter-spacing: 0.35em; }
      #btn-start { padding: 14px 36px; letter-spacing: 0.22em; }
      .side-deco { display: none; }
    }
    @media (max-height: 600px) {
      .deco-line { display: none; }
      #cta-wrap  { margin-top: 28px; }
    }
  </style>
</head>
<body>


  <div id="bg"></div>
  <div id="overlay"></div>
  <div id="grain"></div>
  <div id="vignette"></div>

  <div class="side-deco left">Echo Masks — Psychological Thriller — 2026</div>
  <div class="side-deco right">القاعة المقنعة — ألعاب التحليل النفسي</div>

  <main id="hero" role="main">
    <div class="deco-line" aria-hidden="true">
      <span></span>
      <em>Psychological Thriller</em>
      <span></span>
    </div>

    <div id="title-wrap">
      <span id="title-echo" aria-hidden="true">ECHO</span>
      <span id="title-masks">MASKS</span>
    </div>

    <p id="subtitle">من أنت خلف القناع؟</p>

    <div id="cta-wrap">
      <div id="cta-ring" aria-hidden="true"></div>
      <button id="btn-start" aria-label="ابدأ اللعب">
        <span class="btn-corner-bl" aria-hidden="true"></span>
        <svg class="btn-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ابدأ اللعب
      </button>
    </div>

    <p id="player-badge">
      <strong id="online-count">—</strong>&nbsp;لاعب متصل الآن
    </p>
  </main>

  <nav id="nav-bar" role="navigation" aria-label="التنقل الرئيسي">
    <button class="nav-item active" data-page="home" aria-label="الصفحة الرئيسية" aria-current="page">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 10.5L12 3L21 10.5V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V10.5Z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span>الرئيسية</span>
    </button>

    <button class="nav-item" data-page="profile" aria-label="الملف الشخصي">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 20C4 17 7.58 14.5 12 14.5C16.42 14.5 20 17 20 20"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M10 7.5C10.5 8 11.2 8.3 12 8.3C12.8 8.3 13.5 8 14 7.5"
              stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      </svg>
      <span>ملفي</span>
    </button>

    <button class="nav-item" data-page="settings" aria-label="الإعدادات">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 2v2.5M12 19.5V22M4.22 4.22l1.77 1.77M18.01 18.01l1.77 1.77M2 12h2.5M19.5 12H22M4.22 19.78l1.77-1.77M18.01 5.99l1.77-1.77"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>الإعدادات</span>
    </button>
  </nav>

  <script>
  "use strict";



  /* ── Navigation ── */
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(btn => {
    btn.addEventListener('click', function() {
      const r = document.createElement('span');
      r.className = 'ripple';
      this.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
      navItems.forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-current'); });
      this.classList.add('active');
      this.setAttribute('aria-current', 'page');
      console.log('[Echo Masks] Navigate to:', this.dataset.page);
    });
  });

  /* ── Start Button ── */
  document.getElementById('btn-start').addEventListener('click', function() {
    this.textContent = '...';
    this.style.opacity = '0.6';
    this.style.pointerEvents = 'none';
    console.log('[Echo Masks] Starting game...');
    setTimeout(() => { this.textContent = 'جاري التحميل...'; }, 300);
  });

  /* ── Simulated Online Count ── */
  (function() {
    const el = document.getElementById('online-count');
    let base = 24 + Math.floor(Math.random() * 12);
    el.textContent = base;
    setInterval(() => {
      base = Math.max(8, Math.min(99, base + (Math.random() < 0.5 ? 1 : -1)));
      el.textContent = base;
    }, 4000);
  })();

  /* ── Keyboard shortcut ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON')
      document.getElementById('btn-start').click();
  });
  </script>
</body>
</html>
