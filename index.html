<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* المتغيرات الأساسية (CSS Variables) لسهولة التعديل */
        :root {
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-color: #8a2be2; /* لون بنفسجي يعطي طابعاً غامضاً ومناسباً للتصميم الداكن */
            --font-family: 'Tajawal', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            /* تأكد من تغيير اسم الصورة أدناه إلى اسم ملف صورتك الفعلي */
            background: url('BackGround.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* حاوية المربعات (Cards Container) */
        .cards-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            /* إضافة مساحة سفلية لتجنب تغطية الشريط السفلي للمحتوى */
            padding-bottom: 100px; 
            width: 100%;
            max-width: 480px; /* تقييد العرض ليناسب الهواتف حتى على الشاشات الكبيرة */
            margin: 0 auto;
        }

        /* التصميم الزجاجي الداكن للمربعات (Dark Glassmorphism) */
        .card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* لدعم متصفحات سفاري */
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: var(--glass-shadow);
            text-align: right;
            transition: transform 0.3s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* تنسيق خاص للمربع الثالث */
        .card.coming-soon {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            text-align: center;
            background: rgba(15, 15, 20, 0.4); /* شفافية أعلى قليلاً */
        }

        .card.coming-soon h2 {
            font-size: 2rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(90deg, #555, #fff, #555);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 20px 0; /* مساحة إضافية من الأسفل للأجهزة الحديثة */
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            gap: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item .icon {
            font-size: 1.5rem;
            filter: grayscale(100%) opacity(0.7);
            transition: all 0.3s ease;
        }

        /* تأثير الزر النشط (Active) */
        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item.active .icon {
            filter: grayscale(0%) drop-shadow(0 0 8px var(--accent-color));
            transform: translateY(-4px);
        }

        /* حركة خفيفة لنص Coming Soon */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body>

    <main class="cards-container">
        <div class="card">
            <h2>المستوى الأول</h2>
            <p>المستوى الأساسي لاكتشاف الهويات المخفية وبدء اللعب.</p>
        </div>

        <div class="card">
            <h2>المستوى الثاني</h2>
            <p>المستوى الصعب المتقدم مع تحديات الكلمات المسروقة.</p>
        </div>

        <div class="card coming-soon">
            <h2>Coming soon</h2>
        </div>
    </main>

    <nav class="bottom-nav">
        <a class="nav-item" id="nav-settings">
            <span class="icon">⚙️</span>
            <span>الإعدادات</span>
        </a>
        
        <a class="nav-item active" id="nav-home">
            <span class="icon">🏠</span>
            <span>الرئيسية</span>
        </a>
        
        <a class="nav-item" id="nav-profile">
            <span class="icon">👤</span>
            <span>الملف الشخصي</span>
        </a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault(); // منع السلوك الافتراضي للرابط
                    
                    // إزالة فئة active من جميع الأزرار
                    navItems.forEach(nav => nav.classList.remove('active'));
                    
                    // إضافة فئة active للزر الذي تم النقر عليه
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
