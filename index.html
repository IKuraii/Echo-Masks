<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masks - Bento Box UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --crimson-red: #dc143c;
            --blood-glow: rgba(220, 20, 60, 0.6);
            --glass-bg-start: rgba(40, 40, 45, 0.4);
            --glass-bg-end: rgba(10, 10, 12, 0.75);
            --text-pure-white: #ffffff;
            --bento-radius: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #050505 url('BackGround(3).png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-pure-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }

        /* --- الشعار والعنوان --- */
        header {
            margin-top: 60px;
            margin-bottom: 40px;
            text-align: center;
        }

        h1.game-title {
            font-family: 'Cinzel', serif;
            font-size: 3.8rem;
            letter-spacing: 6px;
            color: var(--text-pure-white);
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--blood-glow), 0 0 35px var(--crimson-red), 0 0 50px #8a0303;
        }

        /* --- تخطيط البينتو الحقيقي (Bento Box Grid) --- */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* عمودين متساويين */
            gap: 16px;
            width: 90%;
            max-width: 420px; /* مقاس مثالي للهواتف */
        }

        /* المربع الأول: يأخذ العرض كاملاً (عمودين) */
        .bento-wide {
            grid-column: span 2;
            min-height: 140px;
        }

        /* المربعات الصغيرة: مربعات مثالية */
        .bento-square {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- الزجاج الداكن المتقدم (Advanced Glassmorphism) --- */
        .bento-item {
            background: linear-gradient(145deg, var(--glass-bg-start) 0%, var(--glass-bg-end) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--bento-radius);
            padding: 24px 20px;
            text-align: right;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            /* حدود زجاجية 3D: أبيض من الأعلى وأحمر من الأسفل */
            border-top: 1.5px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1.5px solid rgba(220, 20, 60, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(220, 20, 60, 0.15);
            
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* تأثير التمرير والضغط (Hover & Active) */
        .bento-item:hover, .bento-item:active {
            transform: translateY(-5px) scale(1.02);
            /* توهج دموي للحدود */
            border-top-color: var(--crimson-red);
            border-bottom-color: var(--crimson-red);
            border-left-color: var(--crimson-red);
            border-right-color: var(--crimson-red);
            box-shadow: 0 15px 30px var(--blood-glow);
        }

        .bento-item h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-pure-white);
        }

        .bento-item p {
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        /* تنسيق خاص لمربع Coming Soon */
        .bento-square.coming-soon {
            align-items: center;
            text-align: center;
            background: linear-gradient(145deg, rgba(20, 20, 25, 0.5) 0%, rgba(5, 5, 8, 0.8) 100%);
        }

        .bento-square.coming-soon h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        /* --- شريط التنقل السفلي الاحترافي --- */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 380px;
            height: 75px;
            background: linear-gradient(145deg, rgba(30, 30, 35, 0.6) 0%, rgba(10, 10, 12, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(220, 20, 60, 0.2);
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: rgba(255, 255, 255, 0.5); /* لون الأيقونات غير النشطة */
        }

        /* تنسيق أيقونات SVG */
        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        /* حالة الزر النشط (Active) */
        .nav-item.active {
            color: var(--text-pure-white); /* أيقونة بيضاء ناصعة */
            background: rgba(220, 20, 60, 0.2);
            border: 1px solid rgba(220, 20, 60, 0.5);
            box-shadow: 0 0 20px var(--blood-glow), inset 0 0 10px rgba(220, 20, 60, 0.2);
            transform: translateY(-8px); /* رفع للأعلى بشكل واضح */
        }

        .nav-item.active svg {
            stroke: var(--text-pure-white);
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

    </style>
</head>
<body>

    <header>
        <h1 class="game-title">Masks</h1>
    </header>

    <main class="bento-grid">
        
        <div class="bento-item bento-wide">
            <h2>المستوى الأول</h2>
            <p>اللعب الأساسي</p>
        </div>

        <div class="bento-item bento-square">
            <h2>المستوى الثاني</h2>
            <p>الكلمات السرية</p>
        </div>

        <div class="bento-item bento-square coming-soon">
            <h2>Coming<br>Soon</h2>
        </div>
        
    </main>

    <nav class="bottom-nav">
        <div class="nav-item" id="nav-settings">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
        
        <div class="nav-item active" id="nav-home">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </div>
        
        <div class="nav-item" id="nav-profile">
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    // إزالة التفعيل من جميع الأزرار
                    navItems.forEach(nav => nav.classList.remove('active'));
                    
                    // إضافة التفعيل للزر الحالي ليرتفع ويتوهج
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
