<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Masks - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login-style.css">
</head>
<body>

    <div class="bg-blur"></div>

    <main class="login-box" id="loginBox">
        
        <div class="header-text">
            <h2>اختر هويتك</h2>
            <p>تستر خلف قناعك للعبور</p>
        </div>

        <div class="masks-container">
            <div class="mask-circle" data-mask="fox">
                <svg viewBox="0 0 24 24" class="mask-icon">
                    <path d="M22 3l-4.5 4.5c.3.9.5 1.9.5 3 0 5.5-6 10.5-6 10.5S6 16 6 10.5c0-1.1.2-2.1.5-3L2 3l5 2.5c1.4-1 3.1-1.5 5-1.5s3.6.5 5 1.5L22 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M9 10l-2 1m8-1l2 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            
            <div class="mask-circle" data-mask="wolf">
                <svg viewBox="0 0 24 24" class="mask-icon">
                    <path d="M12 22s-8-5.5-8-12C4 5.5 8 2 12 2s8 3.5 8 8c0 6.5-8 12-8 12z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M12 16v2m-3-6l2 1m4-1l-2 1M6 8l3 2m6-2l-3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            
            <div class="mask-circle" data-mask="lion">
                <svg viewBox="0 0 24 24" class="mask-icon">
                    <path d="M12 4a8 8 0 00-8 8c0 5 4 9 8 9s8-4 8-9a8 8 0 00-8-8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M12 2v2m0 18v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m18 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M9 11h.01M15 11h.01M12 15v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <div class="inputs-container">
            <div class="input-group">
                <input type="text" id="playerName" placeholder="الاسم المستعار" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="playerPassword" placeholder="كلمة المرور">
            </div>
        </div>

        <button class="login-btn" id="loginBtn">دخول</button>
        
        <p id="errorMsg" class="error-msg">الرجاء اختيار قناع وإدخال الاسم.</p>
    </main>

    <div class="welcome-message" id="welcomeMessage"></div>

    <script src="login-script.js"></script>
</body>
</html>
