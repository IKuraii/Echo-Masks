<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Masks - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login-style.css">
</head>
<body>

    <div class="bg-blur"></div>

    <main class="login-box" id="loginBox">
        
        <div class="header-text">
            <h2>اختر هويتك</h2>
            <p>تستر خلف قناعك للعبور</p>
        </div>

        <div class="avatar-section">
            <div class="main-avatar" id="mainAvatarBtn">
                <svg viewBox="0 0 24 24" class="add-icon" id="addIcon">
                    <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="masks-popup" id="masksPopup">
                
                <div class="mask-option" data-mask="fox">
                    <svg viewBox="0 0 64 64" class="mask-svg">
                        <path d="M32 58L12 40V20l10-14 10 10 10-10 10 14v20L32 58z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M22 30c0-4 4-6 6-4s2 6-6 4zM42 30c0-4-4-6-6-4s-2 6 6 4z" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M32 44v8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <path d="M12 20c8 5 12 5 20 5s12 0 20-5" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                
                <div class="mask-option" data-mask="wolf">
                    <svg viewBox="0 0 64 64" class="mask-svg">
                        <path d="M32 60l-12-16-10-4V20l6-12 16 12 16-12 6 12v20l-10 4L32 60z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M18 28l6 4-2-6zM46 28l-6 4 2-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M32 42v10l-4-4h8l-4 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M32 20v15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                
                <div class="mask-option" data-mask="lion">
                    <svg viewBox="0 0 64 64" class="mask-svg">
                        <path d="M32 60c-15 0-24-10-24-25V15l10-5 14-6 14 6 10 5v20C56 50 47 60 32 60z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <circle cx="24" cy="30" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="40" cy="30" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M32 40l-5 8h10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M8 25c0 0-6 5-4 15s8 10 8 10M56 25c0 0 6 5 4 15s-8 10-8 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>

            </div>
        </div>

        <div class="inputs-container">
            <div class="input-group">
                <input type="text" id="playerName" placeholder="الاسم المستعار" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="playerPassword" placeholder="كلمة المرور">
            </div>
        </div>

        <button class="login-btn" id="loginBtn">دخول</button>
        
        <p id="errorMsg" class="error-msg">الرجاء اختيار قناع وإدخال الاسم.</p>
    </main>

    <div class="welcome-message" id="welcomeMessage"></div>

    <script src="login-script.js"></script>
</body>
</html>
