<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile UI Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-blur: blur(20px);
            
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-border: rgba(255, 255, 255, 0.15);
            
            --accent-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            /* خلفية متدرجة خفيفة تعطي نفس إحساس الصورة الأصلية */
            background: radial-gradient(circle at 80% 20%, #2a2a2f 0%, #121212 50%);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* حاوية التطبيق (نفس مقاس شاشة الجوال) */
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 0 15px;
            padding-bottom: 100px; /* مساحة للشريط السفلي */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* الكروت الزجاجية العامة */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: var(--panel-blur);
            -webkit-backdrop-filter: var(--panel-blur);
            border: 1px solid var(--panel-border);
            border-radius: 30px;
            padding: 20px;
        }

        /* --- القسم العلوي (البروفايل) --- */
        .profile-header {
            position: relative;
            padding: 30px 20px;
            border-radius: 35px;
            background: linear-gradient(180deg, rgba(30,30,35,0.8) 0%, rgba(20,20,22,0.9) 100%);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .stats-avatar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .stat-block {
            text-align: center;
            flex: 1;
        }

        .stat-num {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* مكان صورة الوجه (دائرة فارغة) */
        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 4px;
            flex-shrink: 0;
            margin: 0 15px;
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.1); /* لون مؤقت للصورة */
        }

        .profile-info {
            text-align: center;
        }

        .profile-name {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .verified-badge {
            width: 14px;
            height: 14px;
            background: var(--text-secondary);
            border-radius: 50%;
        }

        .profile-tags {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 20px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* --- قسم الشبكة (الكروت في المنتصف) --- */
        .grid-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* الكرت الأيسر */
        .card-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(200,200,200,0.1) 0%, rgba(255,255,255,0.02) 100%);
        }

        .mini-profile {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .mini-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .mini-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.65rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-top: 8px;
        }

        .btn-buy {
            margin-top: 20px;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 20px;
            padding: 10px;
            width: 100%;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* الكرت الأيمن (مكان القفل) */
        .card-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, rgba(150,130,120,0.1) 0%, rgba(255,255,255,0.02) 100%);
            min-height: 180px;
        }

        .lock-placeholder {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.05); /* مربع فارغ مكان القفل */
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .duration-badge {
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- الكرت السفلي العريض (مكان النجمة) --- */
        .bottom-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(200,200,200,0.15) 0%, rgba(255,255,255,0.05) 100%);
        }

        .bottom-card-content {
            flex: 1;
            padding-right: 15px;
        }

        .tag-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 8px;
        }

        .main-title {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .link-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .star-placeholder {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.05); /* مربع فارغ مكان النجمة */
            border-radius: 20px;
        }

        /* --- شريط التنقل السفلي --- */
        .bottom-nav-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(20, 20, 22, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .nav-item.active {
            background: rgba(255,255,255,0.15); /* إضاءة الزر النشط */
        }

        /* أيقونات بسيطة كبديل مؤقت (SVG) */
        svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--text-secondary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .nav-item.active svg { stroke: #fff; }
        .btn svg { stroke: #fff; width: 16px; height: 16px; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="glass-panel profile-header">
            <div class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </div>
            
            <div class="stats-avatar-row">
                <div class="stat-block">
                    <div class="stat-num">34.9 K</div>
                    <div class="stat-label">followers</div>
                </div>
                
                <div class="avatar-container">
                    <div class="avatar-placeholder"></div>
                </div>
                
                <div class="stat-block">
                    <div class="stat-num">2245</div>
                    <div class="stat-label">following</div>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-name">
                    Emily Carter <div class="verified-badge"></div>
                </div>
                <div class="profile-tags">
                    E-gamer | Kawaii lover | Zodiac girl
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Follow
                </button>
                <button class="btn">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Messages
                </button>
            </div>
        </div>

        <div class="grid-section">
            
            <div class="glass-panel card-left">
                <div class="mini-profile">
                    <div class="mini-avatar"></div>
                    <div>
                        <div class="mini-name">Emily Carter <span style="display:inline-block; width:10px; height:10px; background:#888; border-radius:50%;"></span></div>
                        <div class="card-desc">Hi! Set for those who want to see awesome gameplay! Spoiler alert - I win!</div>
                    </div>
                </div>
                <button class="btn-buy">Buy $5.99</button>
            </div>

            <div class="glass-panel card-right">
                <div class="lock-placeholder"></div>
                <div class="duration-badge">
                    <svg style="width:12px;height:12px;stroke:#ccc;" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                    21:24
                </div>
            </div>
        </div>

        <div class="glass-panel bottom-card">
            <div class="bottom-card-content">
                <div class="tag-title">
                    <svg style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
                    The best price
                </div>
                <div class="main-title">Unlock all<br>exclusive content</div>
                <div class="link-text">Upgrade to Silver</div>
            </div>
            
            <div class="star-placeholder"></div>
        </div>

    </div>

    <div class="bottom-nav-container">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" ry="2"/><path d="M3 4l9 6 9-6"/></svg>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
    </div>

</body>
</html>
