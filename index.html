<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game UI - Grimdark Glassmorphism</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        
        <header class="top-header">
            <h1>مساء الخير، Muzushi</h1>
        </header>
        
        <nav class="sidebar-nav glass-card">
            <div class="nav-item active" onclick="setActive(this)">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <div class="nav-item" onclick="setActive(this)">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="nav-item" onclick="setActive(this)">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div class="nav-item" onclick="setActive(this)">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </nav>

        <main class="main-content">
            <div class="levels-grid">
                <div class="glass-card level-primary">
                    <span class="level-badge">متاح الآن</span>
                    <h2>المستوى الأول</h2>
                </div>

                <div class="glass-card level-secondary">
                    <h3>المستوى الثاني</h3>
                    <svg style="width:40px; stroke:var(--text-secondary); fill:none; stroke-width:2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                
                <div class="glass-card level-secondary coming-soon">
                    <h3>قريباً</h3>
                    <svg style="width:40px; stroke:var(--text-secondary); fill:none; stroke-width:2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
            </div>

            <div class="glass-card last-game-card">
                <div class="last-game-info">
                    <h3>آخر لعبة</h3>
                    <p>الكلمة: قناع | النتيجة: فوز</p>
                </div>
                <div class="game-status">
                    +150 نقطة
                </div>
            </div>
        </main>

        <aside class="friends-sidebar glass-card">
            <div class="friends-header">
                <h3>الأصدقاء المتصلين</h3>
                <span style="color: var(--text-secondary);">4</span>
            </div>
            
            <div class="friends-list">
                <div class="friend-item">
                    <div class="friend-avatar"><div class="online-dot"></div></div>
                    <div class="friend-info">
                        <h4>ShadowWalker</h4>
                        <p>في غرفة الانتظار</p>
                    </div>
                </div>
                <div class="friend-item">
                    <div class="friend-avatar"><div class="online-dot"></div></div>
                    <div class="friend-info">
                        <h4>NightFox</h4>
                        <p>يلعب المستوى الأول</p>
                    </div>
                </div>
                <div class="friend-item">
                    <div class="friend-avatar"><div class="online-dot"></div></div>
                    <div class="friend-info">
                        <h4>RavenX</h4>
                        <p>متاح</p>
                    </div>
                </div>
                <div class="friend-item">
                    <div class="friend-avatar"><div class="online-dot"></div></div>
                    <div class="friend-info">
                        <h4>GrimReaper</h4>
                        <p>متاح</p>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
