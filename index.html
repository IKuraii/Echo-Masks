<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --nav-bg: #34353e; /* لون شريط التنقل المطابق للصورة */
            --nav-active: rgba(255, 255, 255, 0.12); /* تأثير الدائرة للزر النشط */
            --font-family: 'Tajawal', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            /* لون داكن يملأ الفراغات للشاشات الكبيرة */
            background: #050505 url('BackGround(2).png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            body {
                background-size: contain;
            }
        }

        /* حاوية المربعات بنظام الشبكة (Grid Layout) */
        .cards-container {
            flex: 1;
            display: grid;
            /* 
              نظراً لأن الاتجاه RTL (من اليمين لليسار):
              العمود الأول (يمين) هو للمستوى الثاني.
              العمود الثاني (يسار) هو للمستوى الأول و coming soon.
            */
            grid-template-areas: 
                "level2 level1"
                ". comingsoon";
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            padding-bottom: 120px; /* مساحة للشريط العائم */
            width: 100%;
            max-width: 480px;
            margin: auto;
            align-content: center;
        }

        /* تخصيص أماكن المربعات في الشبكة */
        .card-l1 { grid-area: level1; }
        .card-l2 { grid-area: level2; }
        .card-cs { grid-area: comingsoon; }

        /* التصميم الزجاجي والمربع (Square Cards) */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px 10px;
            aspect-ratio: 1 / 1; /* تجعل العنصر مربعاً بشكل مثالي */
            transition: transform 0.3s ease;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* تنسيق المربع الثالث (Coming Soon) */
        .card.coming-soon {
            background: rgba(15, 15, 20, 0.4);
        }

        .card.coming-soon h2 {
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(90deg, #555, #fff, #555);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }

        /* شريط التنقل السفلي (أسلوب الكبسولة - Pill Style) */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            border-radius: 50px; /* شكل الكبسولة */
            display: flex;
            flex-direction: row; /* بالعرض */
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            text-decoration: none;
            color: #8c8c95; /* لون أيقونات غير نشطة */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .nav-item span {
            font-size: 0.65rem;
            margin-top: 4px;
            font-weight: 700;
        }

        /* تأثير الزر النشط (دائرة مضيئة) مطابق للصورة */
        .nav-item.active {
            background: var(--nav-active);
            color: #ffffff;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <main class="cards-container">
        <!-- المربع الأول (اليسار) -->
        <div class="card card-l1">
            <h2>المستوى الأول</h2>
            <p>الأساسي لاكتشاف الهويات</p>
        </div>

        <!-- المربع الثاني (اليمين) -->
        <div class="card card-l2">
            <h2>المستوى الثاني</h2>
            <p>متقدم بكلمات مسروقة</p>
        </div>

        <!-- المربع الثالث (تحت اليسار) -->
        <div class="card coming-soon card-cs">
            <h2>Coming<br>soon</h2>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <!-- الإعدادات (يمين) -->
        <a class="nav-item" id="nav-settings">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>الإعدادات</span>
        </a>
        
        <!-- الرئيسية (وسط نشط) -->
        <a class="nav-item active" id="nav-home">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>الرئيسية</span>
        </a>
        
        <!-- الملف الشخصي (يسار) -->
        <a class="nav-item" id="nav-profile">
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>حسابي</span>
        </a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
