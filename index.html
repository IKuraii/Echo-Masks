<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masks - Game Interface</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* المتغيرات لتسهيل التعديل على الألوان والتأثيرات */
        :root {
            --crimson-red: #dc143c;
            --crimson-glow: rgba(220, 20, 60, 0.5);
            --glass-bg: rgba(10, 10, 12, 0.55); /* خلفية سوداء شبه شفافة */
            --glass-border: rgba(220, 20, 60, 0.15); /* حدود حمراء خافتة جداً */
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --bento-radius: 28px; /* انحناء أسلوب البينتو بوكس */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            /* ربط صورة الخلفية وجعلها ثابتة بملء الشاشة */
            background: #050505 url('BackGround(2).png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px; /* مساحة للشريط السفلي لتجنب تغطية المحتوى */
        }

        /* --- الشعار والعنوان --- */
        header {
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1.game-title {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            /* توهج أحمر داكن يتماشى مع الخلفية */
            text-shadow: 0 0 15px var(--crimson-glow), 0 0 30px var(--crimson-red);
        }

        /* --- تخطيط البينتو بوكس (Bento Box) --- */
        .bento-container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* المسافات المتناسقة بين المربعات */
            width: 90%;
            max-width: 450px; /* للحفاظ على تصميم الهاتف حتى في الشاشات الأكبر */
        }

        /* تأثير الزجاج الداكن للمربعات */
        .bento-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--bento-radius);
            padding: 24px 20px;
            text-align: right;
            transition: transform 0.2s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .bento-card:active {
            transform: scale(0.98);
        }

        .bento-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .bento-card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* تنسيق خاص لمربع Coming Soon */
        .bento-card.card-cs {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 130px;
            text-align: center;
            background: rgba(10, 10, 12, 0.3); /* شفافية أعلى قليلاً */
        }

        .bento-card.card-cs h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin: 0;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        /* --- شريط التنقل السفلي (شكل الكبسولة) --- */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 40px; /* شكل الكبسولة الممتدة */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            opacity: 0.5;
            filter: grayscale(100%);
        }

        /* تأثير الزر النشط (Active) بتوهج أحمر */
        .nav-item.active {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(220, 20, 60, 0.15);
            box-shadow: 0 0 15px var(--crimson-glow);
            border: 1px solid rgba(220, 20, 60, 0.3);
            transform: translateY(-4px); /* رفع الزر للأعلى قليلاً */
        }

    </style>
</head>
<body>

    <header>
        <h1 class="game-title">Masks</h1>
    </header>

    <main class="bento-container">
        
        <div class="bento-card">
            <h2>المستوى الأول</h2>
            <p>اللعب الأساسي</p>
        </div>

        <div class="bento-card">
            <h2>المستوى الثاني</h2>
            <p>الكلمات السرية</p>
        </div>

        <div class="bento-card card-cs">
            <h2>Coming soon</h2>
        </div>
        
    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item" id="nav-settings">
            ⚙️
        </a>
        
        <a href="#" class="nav-item active" id="nav-home">
            🏠
        </a>
        
        <a href="#" class="nav-item" id="nav-profile">
            👤
        </a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault(); // منع الرابط من الانتقال لأعلى الصفحة
                    
                    // إزالة التفعيل من جميع الأزرار
                    navItems.forEach(nav => nav.classList.remove('active'));
                    
                    // إضافة التفعيل للزر المضغوط
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
